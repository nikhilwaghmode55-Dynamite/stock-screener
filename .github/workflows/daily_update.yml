name: Daily Signal Update

on:
  schedule:
    # Runs at 10:30 UTC Monday-Friday, exactly 4:00 PM IST (16:00 IST) post-market
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  update-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run precompute script
        run: python precompute.py

      - name: Commit and push updated signals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add precomputed_signals.csv
          git commit -m "Automated post-market signal update [skip ci]" || echo "No changes to commit"
          git push