name: Daily Market Data Update

on:
  schedule:
    # 10:30 UTC is exactly 4:00 PM IST. 1-5 means Monday through Friday.
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows you to click a button on GitHub to test it manually

jobs:
  update-signals:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas

    - name: Run daily fetcher
      run: python precompute.py

    - name: Commit and Push new data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add precomputed_signals.csv
        # Only commit if the data actually changed
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated post-market data update"
        git push